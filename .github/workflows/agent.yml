name: build-scan-sign-agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rania4363/churn-agent

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 pour le scan
        uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64
          load: true
          tags: scan-target:latest

      - name: Scan Trivy (échec si CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: scan-target:latest
          version: v0.69.3
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build et push multi-arch
        id: push
        uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.run_number }}

      - uses: sigstore/cosign-installer@v3

      - name: Signature Cosign (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
