name: build-scan-sign-mlflow

on:
  push:
    branches: [main]
    paths:
      - "mlflow/**"
      - ".github/workflows/mlflow.yml"
  workflow_dispatch:

env:
  MLFLOW_VERSION: "3.18.0"
  IMAGE: ghcr.io/rania4363/mlflow-server

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 pour le scan
        uses: docker/build-push-action@v6
        with:
          context: mlflow
          build-args: MLFLOW_VERSION=${{ env.MLFLOW_VERSION }}
          platforms: linux/amd64
          load: true
          tags: scan-target:latest

      - name: Scan Trivy (échec si CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build et push multi-arch
        id: push
        uses: docker/build-push-action@v6
        with:
          context: mlflow
          build-args: MLFLOW_VERSION=${{ env.MLFLOW_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ env.MLFLOW_VERSION }}-${{ github.run_number }}

      - uses: sigstore/cosign-installer@v3

      - name: Signature Cosign (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
